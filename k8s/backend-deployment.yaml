apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-backend
  namespace: crud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-backend
  template:
    metadata:
      labels:
        app: crud-backend
    spec:
      containers:
        - name: crud-backend
          image: 959222626282.dkr.ecr.ap-south-1.amazonaws.com/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/crud"
